syntax = "proto3";

package example.order.v1;

// === GOOD PATTERN ===
// Each message defines its own item type, so they can evolve
// independently. Adding "quantity" to CreateOrderItem does not
// affect OrderResponseItem or RecommendationItem.

// Item representation for creating an order.
message CreateOrderItem {
  string item_id = 1;
  int64 price_cents = 2;
  int32 quantity = 3;
}

// Item representation returned in order responses.
message OrderResponseItem {
  string item_id = 1;
  string name = 2;
  int64 price_cents = 3;
  string image_url = 4;
}

// Item representation for recommendation lists.
message RecommendationItem {
  string item_id = 1;
  string name = 2;
  int64 price_cents = 3;
  double score = 4;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated CreateOrderItem items = 2;  // OK: unique repeated type
  string shipping_address = 3;
}

message GetOrderResponse {
  string order_id = 1;
  string status = 2;
  repeated OrderResponseItem items = 3;  // OK: unique repeated type
  int64 total_price_cents = 4;
}

message ListRecommendationsResponse {
  string category = 1;
  repeated RecommendationItem items = 2;  // OK: unique repeated type
}

// Singular (non-repeated) message fields are not checked by this rule.
message GetOrderRequest {
  string order_id = 1;
  OrderResponseItem preview = 2;  // OK: not repeated
}

// Repeated scalar fields are not checked either.
message BatchDeleteRequest {
  repeated string order_ids = 1;  // OK: scalar type
  repeated int32 item_indices = 2;  // OK: scalar type
}
